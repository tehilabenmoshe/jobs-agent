name: Morning jobs

on:
  schedule:
    # 05:00 UTC = 08:00 בישראל בשעון קיץ (06:00 UTC בשעון חורף)
    - cron: "0 5 * * *"
  workflow_dispatch: # מאפשר להריץ ידנית מלשונית Actions

permissions:
  contents: write # כדי לשמור את רשימת המשרות שכבר נשלחו

concurrency:
  group: morning-jobs
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Find jobs and send email
        run: python scripts/morning_jobs.py
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          CV_TEXT: ${{ secrets.CV_TEXT }}

      - name: Save sent jobs (avoid duplicates tomorrow)
        continue-on-error: true # לא קריטי - רק מונע כפילויות, לא משפיע על שליחת המייל
        run: |
          git config user.name "jobs-bot"
          git config user.email "jobs-bot@users.noreply.github.com"
          git add data/seen_jobs.json
          git diff --staged --quiet && exit 0
          git commit -m "Update seen jobs"
          for i in 1 2 3; do
            git pull --rebase origin main && git push && break
            echo "Retry $i..."; sleep 5
          done
